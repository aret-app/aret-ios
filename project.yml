name: ARET

options:
  bundleIdPrefix: com.lorenzopieri99
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  ARET:
    type: application
    platform: iOS
    sources:
      - path: ARET-iOS
      - path: ARET-Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lorenzopieri99.aret
    info:
      path: ARET-iOS/Info.plist
      properties:
        CFBundleDisplayName: ARET
        NSLocationWhenInUseUsageDescription: "ARET uses your location to show your position and record your mountain activity."
        NSLocationAlwaysAndWhenInUseUsageDescription: "ARET can keep recording your active route while the app is in the background."
        UIBackgroundModes:
          - location
        UILaunchScreen: {}
    dependencies:
      - target: ARETWatch
        embed: true

  ARETWatch:
    type: application
    platform: watchOS
    sources:
      - path: ARET-Watch
      - path: ARET-Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lorenzopieri99.aret.watch
    info:
      path: ARET-Watch/Info.plist
      properties:
        CFBundleDisplayName: ARET
        WKCompanionAppBundleIdentifier: com.lorenzopieri99.aret
        NSHealthShareUsageDescription: "ARET reads workout metrics such as heart rate to show them during your activity."
        NSHealthUpdateUsageDescription: "ARET saves your hiking and climbing workouts to Apple Health."
    entitlements:
      path: ARET-Watch/ARETWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
